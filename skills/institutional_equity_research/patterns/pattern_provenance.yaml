version: "1.0"
purpose: "Trace each adopted functional convention to independent public observations or a documented usability rationale. This ledger does not preserve, reproduce, or authorize reuse of any source's distinctive expression."

adoption_criteria:
  - "Adopt a pattern only when it is a common functional convention, appears in multiple independent sources, or is independently justified by analytical, accessibility, or reproducibility needs."
  - "Record a source ID only as pattern provenance; public access is not a redistribution license."
  - "Do not adopt a distinctive layout, typography, named framework, rating, chart, table, prose structure, color system, icon, or trade dress solely because an institution uses it."
  - "Every grouped entry applies the same provenance, copyright review, and generalized rule to every listed ID."

source_sets:
  equity_research: &equity_research [SRC-001, SRC-002, SRC-003, SRC-004, SRC-006, SRC-007]
  report_design: &report_design [SRC-001, SRC-005, SRC-007, SRC-008, SRC-009, SRC-015]
  forensic_accounting: &forensic_accounting [SRC-016, SRC-017, SRC-018, SRC-019, SRC-021, SRC-022, SRC-023, SRC-025]
  cash_and_credit: &cash_and_credit [SRC-010, SRC-011, SRC-012, SRC-020, SRC-023, SRC-024, SRC-027]
  diligence_and_ic: &diligence_and_ic [SRC-010, SRC-011, SRC-012, SRC-013, SRC-014, SRC-015, SRC-026]

provenance_sets:
  - provenance_id: PRV-001
    pattern_ids: [AR-001, AR-004, AR-005]
    pattern_name: "Fundamental, earnings-update, and initiation report archetypes"
    observed_in: *equity_research
    adoption_basis: multi_source_observation
    generalized_rule: "Organize source-backed company analysis from decision frame through business economics, financial history, forecast or valuation when permitted, risks, and disclosures."
    distinctive_expression_copied: false
    copyright_review: passed
    approved_for_use: true

  - provenance_id: PRV-002
    pattern_ids: [AR-002, AR-006]
    pattern_name: "Public-side diligence and investment committee archetypes"
    observed_in: *diligence_and_ic
    adoption_basis: multi_source_observation
    generalized_rule: "Place decision question, evidence for and against, scope limits, open questions, risk context, and follow-up ownership in a bounded memo or diligence structure."
    distinctive_expression_copied: false
    copyright_review: passed
    approved_for_use: true

  - provenance_id: PRV-003
    pattern_ids: [AR-003]
    pattern_name: "Forensic accounting review archetype"
    observed_in: *forensic_accounting
    adoption_basis: multi_source_observation
    generalized_rule: "Compare reported earnings, cash flow, balance-sheet movements, policies, controls, and history while retaining alternative explanations and non-accusatory labels."
    distinctive_expression_copied: false
    copyright_review: passed
    approved_for_use: true

  - provenance_id: PRV-004
    section_ids: [research_dashboard, company_overview, business_model, revenue_drivers, historical_performance, quarterly_performance, segment_analysis, unit_economics, earnings_quality, cash_flow_quality, working_capital, balance_sheet, capital_allocation, management_credibility, governance, industry_structure, competitive_position, forecast, valuation, catalysts, risks, public_side_diligence_findings, red_flags, open_questions, thesis_breaking_conditions, evidence_for, evidence_against, appendix, sources_and_disclosures]
    pattern_name: "Section blueprint completion contracts"
    observed_in: [SRC-001, SRC-003, SRC-006, SRC-013, SRC-015]
    adoption_basis: multi_source_observation_and_independent_justification
    generalized_rule: "For each decision section, require an answer, evidence, calculations where relevant, counterevidence, citations, limitations, and a completion gate rather than copying a publisher's exact headings."
    distinctive_expression_copied: false
    copyright_review: passed
    approved_for_use: true

  - provenance_id: PRV-005
    pattern_ids: [AP-001, AP-002, AP-003, AP-004, AP-007, AP-009, AP-010, AP-011]
