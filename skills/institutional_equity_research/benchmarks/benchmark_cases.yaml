universal_acceptance_tests:
  - Correct report archetype and section order are selected from the support files.
  - Sector KPIs are supported by issuer disclosures and unavailable fields are explicit.
  - Applicable forensic tests retain inputs, formula version, alternatives, and limitations.
  - Required diligence categories are present with bounded public-side statuses.
  - Chart selection and visual density match the analytical question.
  - Actuals, estimates, and scenarios are visibly distinct.
  - Every material claim and display has source provenance.
  - Visuals are original and manifest-gated; no logo, branding, or trade dress is copied.
  - No unsupported rating, target price, peer datum, consensus datum, or forecast appears.
  - No fabricated value, citation, quotation, accession, or source appears.
  - Open questions, counterevidence, and thesis-breaking conditions remain visible.
