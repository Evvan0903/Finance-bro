version: "1.0"
purpose: "Metadata-only ledger for legally accessible public materials reviewed to abstract common research methods. It is not a content store, training set, report archive, or source of issuer-specific conclusions."
access_rules:
  - "Public access does not establish a redistribution license."
  - "Record only metadata, original generalized observations, rights assessment, and pinpoint verification references."
  - "Do not store report prose, figures, tables, screenshots, forecasts, ratings, price targets, branded frameworks, or trade dress."
  - "Do not bypass a paywall, form, authentication, robots policy, client portal, or technical control."
  - "Use methodology sources to design workflows; use issuer or authoritative public evidence for issuer-level findings."

